<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOC Console Login | CyberShield</title>
  <meta name="description" content="Secure login portal to access CyberShield SOC telemetry dashboard and threat response control panel.">
  
  <!-- Favicon Logo matching referral -->
  <link rel="icon" type="image/webp" href="assets/logoStackly.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains Mono:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- PRELOADER OVERLAY (Matching Referral Website) -->
  <div id="preloader-overlay" class="preloader-overlay">
    <div class="preloader-wrapper">
      <div class="preloader-graphics-stage">
        <svg class="preloader-svg-graphic" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(0, 243, 255, 0.15)" stroke-width="4"></circle>
          <circle cx="50" cy="50" r="44" fill="none" stroke="#00f3ff" stroke-width="4" stroke-dasharray="70 180" stroke-linecap="round"></circle>
        </svg>
        <img src="assets/logoStackly.webp" alt="CyberShield Logo" class="preloader-icon">
      </div>
      <div class="preloader-status-text">INITIALIZING CYBERSHIELD PLATFORM...</div>
      <div class="preloader-bar-bg">
        <div id="preloader-bar-fill" class="preloader-bar-fill"></div>
      </div>
      <div id="preloader-percent-label" class="preloader-percent-label">0%</div>
    </div>
  </div>

  <!-- Global Interactive Fixed Particle Canvas -->
  <canvas id="global-bg-canvas"></canvas>

  <div class="cyber-grid-overlay"></div>

  <!-- Login Card Container -->
  <section class="auth-container">
    <div class="auth-card reveal-on-scroll">
      <div class="auth-header" style="text-align: center;">
        <a href="index.html" title="Return to Home" style="display: block; text-align: center; margin: 0 auto 16px auto;">
          <img src="assets/logoStackly.webp" alt="CyberShield Logo" class="brand-logo-img" style="height: 54px; margin: 0 auto; display: block;">
        </a>
        <div class="cyber-badge" style="font-size: 0.75rem; margin-bottom: 12px; display: inline-block;">FIDO2 / WEBAUTHN ENFORCED</div>
        <h2>SOC Console Portal</h2>
        <p style="color: var(--text-muted); font-size: 0.95rem;">Select your dashboard role and authenticate session access.</p>
      </div>

      <!-- Role Selector Tabs (Referral Style: User vs Admin Dashboard) -->
      <div class="auth-role-selector">
        <button type="button" class="role-tab-btn active" id="role-user-btn" onclick="selectRole('user')">
          <i class="fa-solid fa-user-shield"></i>
          <span>User Dashboard</span>
        </button>
        <button type="button" class="role-tab-btn" id="role-admin-btn" onclick="selectRole('admin')">
          <i class="fa-solid fa-user-gear"></i>
          <span>Admin Dashboard</span>
        </button>
      </div>

      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" id="email-label">Enterprise Gmail / Email ID <span style="color: var(--alert-red);">*</span></label>
          <input type="email" id="login-email" class="form-input font-mono" value="user@gmail.com" placeholder="user@gmail.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Strong Encrypted Password <span style="color: var(--alert-red);">*</span></label>
          <div style="position: relative;">
            <input type="password" id="login-pass" class="form-input font-mono" value="Cyber@Shield2026!" placeholder="••••••••••••••••" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}" title="Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, one number, and one special character." required style="padding-right: 42px;">
            <i class="fa-solid fa-eye" id="toggle-pass-btn" onclick="togglePasswordVisibility()" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); font-size: 1.1rem; z-index: 5;" title="Toggle Password Eye Mask"></i>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.88rem;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-muted);">
            <input type="checkbox" id="remember-session" required style="accent-color: var(--primary-cyan);">
            <span>Remember Session <span style="color: var(--alert-red);">*</span></span>
          </label>
          <a href="404.html" style="color: var(--primary-cyan); text-decoration: none;">Reset Credentials?</a>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; justify-content: center;">
          <span id="submit-btn-text">Authenticate User Dashboard</span>
          <i class="fa-solid fa-right-to-bracket"></i>
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an enterprise account? <a href="create-account.html" style="color: var(--primary-cyan); font-weight: 600; text-decoration: none;">Get Started</a>
        <div style="margin-top: 16px;">
          <a href="index.html" style="color: var(--text-dim); text-decoration: none; font-size: 0.85rem;"><i class="fa-solid fa-arrow-left"></i> Return to Home</a>
        </div>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
  <script>
    let currentRole = 'user';
    function selectRole(role) {
      currentRole = role;
      const userBtn = document.getElementById('role-user-btn');
      const adminBtn = document.getElementById('role-admin-btn');
      const emailInput = document.getElementById('login-email');
      const submitText = document.getElementById('submit-btn-text');

      if (role === 'admin') {
        userBtn.classList.remove('active');
        adminBtn.classList.add('admin-active');
        adminBtn.classList.remove('active');
        emailInput.value = 'admin.soc@gmail.com';
        emailInput.placeholder = 'admin.soc@gmail.com';
        submitText.textContent = 'Authenticate Admin Dashboard';
      } else {
        adminBtn.classList.remove('admin-active');
        userBtn.classList.add('active');
        emailInput.value = 'user@gmail.com';
        emailInput.placeholder = 'user@gmail.com';
        submitText.textContent = 'Authenticate User Dashboard';
      }
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('login-pass');
      const eyeIcon = document.getElementById('toggle-pass-btn');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
      } else {
        passInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      if (currentRole === 'admin') {
        window.location.href = 'dashboard-admin.html';
      } else {
        window.location.href = 'dashboard-user.html';
      }
    }
  </script>
</body>
</html>
