<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found | CyberShield</title>
  <meta name="description" content="The requested security endpoint or telemetry node was not found on the CyberShield platform.">
  
  <!-- Favicon Logo matching referral -->
  <link rel="icon" type="image/webp" href="assets/logoStackly.webp">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains Mono:wght@400;600;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; padding: 20px;">

  <!-- PRELOADER OVERLAY -->
  <div id="preloader-overlay" class="preloader-overlay">
    <div class="preloader-wrapper">
      <div class="preloader-graphics-stage">
        <img src="assets/logoStackly.webp" alt="CyberShield Logo" class="preloader-icon">
      </div>
      <div class="preloader-status-text">INITIALIZING CYBERSHIELD PLATFORM...</div>
      <div class="preloader-bar-bg">
        <div id="preloader-bar-fill" class="preloader-bar-fill"></div>
      </div>
      <div id="preloader-percent-label" class="preloader-percent-label">0%</div>
    </div>
  </div>

  <!-- Global Interactive Fixed Particle Canvas -->
  <canvas id="global-bg-canvas"></canvas>
  <div class="cyber-grid-overlay"></div>

  <!-- Centered Standalone 404 Portal Container -->
  <div class="container" style="max-width: 500px; width: 100%; position: relative; z-index: 5; margin: auto;">
    <div style="background: rgba(10, 15, 26, 0.88); border: 1px solid var(--border-glow); border-radius: 20px; padding: 32px 24px; box-shadow: var(--glow-cyan); backdrop-filter: blur(20px); text-align: center;">
      
      <!-- Brand Logo -->
      <div style="margin-bottom: 16px;">
        <a href="index.html" class="logo" style="display: inline-block;">
          <img src="assets/logoStackly.webp" alt="CyberShield Logo" style="height: 38px;">
        </a>
      </div>

      <div class="cyber-badge" style="border-color: #ff2a5f; color: #ff2a5f; background: rgba(255, 42, 95, 0.1); margin-bottom: 12px; font-size: 0.76rem; padding: 3px 12px;">
        <i class="fa-solid fa-triangle-exclamation"></i> ERROR 404 &bull; NOT FOUND
      </div>
      
      <h1 style="font-size: clamp(3.2rem, 7vw, 4.6rem); font-weight: 800; font-family: var(--font-mono); line-height: 1; margin-bottom: 6px; background: linear-gradient(135deg, #00f3ff 0%, #ff2a5f 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 18px rgba(0, 243, 255, 0.35));">
        404
      </h1>

      <h2 style="font-size: 1.35rem; margin-bottom: 10px; color: var(--text-main); font-weight: 700;">
        Page Not Found
      </h2>

      <p style="color: var(--text-muted); font-size: 0.92rem; line-height: 1.5; margin-bottom: 22px; max-width: 420px; margin-left: auto; margin-right: auto;">
        The requested page or security endpoint could not be found or has been relocated.
      </p>

      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <button onclick="window.history.back()" class="btn btn-secondary" style="padding: 10px 22px; cursor: pointer; font-size: 0.9rem;">
          <i class="fa-solid fa-arrow-left"></i>
          <span>Go Back</span>
        </button>

        <a href="index.html" class="btn btn-primary" style="padding: 10px 22px; font-size: 0.9rem;">
          <i class="fa-solid fa-house"></i>
          <span>Return Home</span>
        </a>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
